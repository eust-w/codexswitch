name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-core:
    name: Web build and Rust core tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run lint

      - name: Build web app
        run: npm run build:web

      - name: Test Rust core
        run: npm run rust:test

      - name: Run full module simulation
        run: npm run simulate:modules

      - name: Build macOS app bundle
        run: npm run build:mac
