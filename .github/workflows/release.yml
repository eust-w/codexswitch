name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0. Defaults to src-tauri/tauri.conf.json version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos-release:
    name: Build and publish macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run lint

      - name: Build web app
        run: npm run build:web

      - name: Test Rust core
        run: npm run rust:test

      - name: Run full module simulation
        run: npm run simulate:modules

      - name: Detect signing and notarization secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing Apple signing/notarization secrets: ${missing[*]}. Building unsigned preview DMG."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          CERT_ID="$(security find-identity -v -p codesigning build.keychain | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$CERT_ID" ]; then
            CERT_ID="$(security find-identity -v -p codesigning build.keychain | awk -F '"' '/"/ { print $2; exit }')"
          fi
          if [ -z "$CERT_ID" ]; then
            echo "::error::No valid code signing identity was found in the imported certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${CERT_ID}" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS DMG
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac:dmg:signed

      - name: Build unsigned preview macOS DMG
        if: steps.signing.outputs.available != 'true'
        run: npm run build:mac:dmg

      - name: Verify signed app
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=4 src-tauri/target/release/bundle/macos/codexswitch.app
          spctl --assess --type execute --verbose=4 src-tauri/target/release/bundle/macos/codexswitch.app

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexswitch-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG_NAME="${INPUT_TAG:-}"
          if [ -z "$TAG_NAME" ]; then
            case "$REF_NAME" in
              v*) TAG_NAME="$REF_NAME" ;;
              *) TAG_NAME="v${VERSION}" ;;
            esac
          fi

          NOTES_FILE="$(mktemp)"
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            SIGNING_NOTE="The DMG is produced by the Release workflow with Developer ID signing and Apple notarization."
          else
            SIGNING_NOTE="This DMG is an unsigned preview build because Apple Developer signing/notarization secrets were not configured for this workflow run."
          fi
          cat > "$NOTES_FILE" <<EOF
          codexswitch ${TAG_NAME}

          This release contains the macOS DMG for local Web + Tauri macOS v1.

          Scope:
          - Local provider switching for Claude Code, Codex CLI, Codex Desktop, and Gemini
          - Local proxy routing and health checks
          - SQLite-backed provider state and logs
          - Multi-tenant gateway key issuance, usage accounting, and distillation exports
          - Atomic local config writes with backups

          ${SIGNING_NOTE}
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" src-tauri/target/release/bundle/dmg/*.dmg --clobber
          else
            gh release create "$TAG_NAME" src-tauri/target/release/bundle/dmg/*.dmg \
              --title "codexswitch ${TAG_NAME}" \
              --notes-file "$NOTES_FILE"
          fi
