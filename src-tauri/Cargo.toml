[package]
name = "codexswitch"
version = "0.1.0"
description = "Local provider switcher and proxy for Claude Code, Codex, and Gemini"
authors = ["codexswitch"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.85.0"
default-run = "codexswitch"

[lib]
name = "codexswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codexswitch-core"
path = "src/core_server.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.7"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "socks"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tauri = { version = "2.8.2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.22"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
